<div class="site" [style.display]="showContent ? 'block' : 'none'">
  <app-navigation-bar></app-navigation-bar>

  <main>
    <section id="welcome">
      <app-welcome-section></app-welcome-section>
    </section>
    <section id="about_me">
      <app-about-me-section
        [timeline]="timeline"
        [projects]="projects"
        (skillSelect)="filterProjects($event)"
      ></app-about-me-section>
    </section>
    <section id="project">
      <app-projects-section
        [projects]="projects"
        [techFilter]="techFilter"
        (techFilterChange)="filterProjects($event)"
      ></app-projects-section>
    </section>
    <section id="contact">
      <app-contact-section></app-contact-section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="footer-copy">
        {{ "FOOTER.COPYRIGHT" | translate: { year: currentYear } }}
      </p>
      <p class="footer-links">
        <app-privacy-policy-link
          [label]="'FOOTER.PRIVACY' | translate"
        ></app-privacy-policy-link>
        <a class="back-to-top" href="#welcome">{{ "FOOTER.TOP" | translate }} ↑</a>
      </p>
    </div>
  </footer>
</div>
