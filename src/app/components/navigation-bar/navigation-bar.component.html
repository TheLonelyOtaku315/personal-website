<header class="topbar" [class.scrolled]="isScrolled" [class.menu-open]="isMobileMenuOpen">
  <div class="wrap topbar-inner">
    <a
      class="brand"
      href="#welcome"
      (click)="scrollToSection('welcome', $event)"
    >
      <span class="brand-mark" aria-hidden="true">TZ</span>
      <span class="brand-name">Tonny Zhao</span>
    </a>

    <button
      type="button"
      class="menu-btn"
      [attr.aria-label]="'NAV.MENU' | translate"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-controls="sidebar"
      (click)="toggleMobileMenu()"
    >
      <span class="menu-icon" aria-hidden="true"><span></span><span></span></span>
    </button>

    <nav class="nav" id="sidebar" [class.open]="isMobileMenuOpen">
      <ul class="nav-links">
        <li
          *ngFor="let link of links; let i = index"
          [class.active]="currentSection === link.id"
        >
          <a
            [href]="'#' + link.id"
            [attr.aria-current]="currentSection === link.id ? 'true' : null"
            (click)="scrollToSection(link.id, $event)"
          >
            <span class="nav-index" aria-hidden="true">0{{ i + 1 }}</span>
            {{ link.label | translate }}
          </a>
        </li>
      </ul>

      <div class="nav-tools">
        <div
          class="segmented"
          role="group"
          [attr.aria-label]="'NAV.LANGUAGE' | translate"
        >
          <button
            *ngFor="let lang of availableLanguages"
            type="button"
            [attr.lang]="lang.toLowerCase()"
            [class.active]="currentLanguage === lang"
            [attr.aria-pressed]="currentLanguage === lang"
            [title]="languageNames[lang]"
            (click)="toggleLanguage(lang)"
          >
            {{ lang }}
          </button>
        </div>

        <div
          class="segmented icons"
          role="group"
          [attr.aria-label]="'NAV.THEME' | translate"
        >
          <button
            type="button"
            [class.active]="currentThemeMode === 'light'"
            [attr.aria-pressed]="currentThemeMode === 'light'"
            [attr.aria-label]="'NAV.LIGHT' | translate"
            [title]="'NAV.LIGHT' | translate"
            (click)="setTheme('light')"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
            </svg>
          </button>
          <button
            type="button"
            [class.active]="currentThemeMode === 'dark'"
            [attr.aria-pressed]="currentThemeMode === 'dark'"
            [attr.aria-label]="'NAV.DARK' | translate"
            [title]="'NAV.DARK' | translate"
            (click)="setTheme('dark')"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path>
            </svg>
          </button>
          <button
            type="button"
            [class.active]="currentThemeMode === 'auto'"
            [attr.aria-pressed]="currentThemeMode === 'auto'"
            [attr.aria-label]="'NAV.AUTO' | translate"
            [title]="'NAV.AUTO' | translate"
            (click)="setTheme('auto')"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="1.5"></rect>
              <path d="M8 20h8M12 16v4"></path>
            </svg>
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>
