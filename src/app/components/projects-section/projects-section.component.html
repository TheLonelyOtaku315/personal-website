<div class="container">
  <div class="glass">
    <div class="title">
      <h1 class="welcome-text">{{ "PROJECTS.TITLE" | translate }}</h1>
    </div>
    <p class="intro">
      {{ "PROJECTS.INTRO" | translate }}
    </p>
    <section class="projects-section">
      <div class="projects-grid">
        <div
          class="project-card"
          *ngFor="let project of visibleProjects"
          (click)="openProjectDialog(project)"
          (keydown.enter)="openProjectDialog(project)"
          tabindex="0"
          role="button"
        >
          <img
            [src]="getProjectImage(project)"
            [alt]="'PROJECTS.IMAGE_ALT' | translate: { title: project.title }"
            class="project-image"
            loading="lazy"
          />
          <div class="project-content">
            <h3 class="project-title">{{ project.title }}</h3>
            <div
              class="project-links"
              *ngIf="project.demoUrl || project.sourceUrl"
            >
              <a
                *ngIf="project.demoUrl"
                [href]="project.demoUrl"
                target="_blank"
                rel="noopener noreferrer"
                class="project-link"
                (click)="$event.stopPropagation()"
                (keydown.enter)="$event.stopPropagation()"
                >{{ "PROJECTS.DEMO_LINK" | translate }}</a
              >
              <a
                *ngIf="project.sourceUrl"
                [href]="project.sourceUrl"
                target="_blank"
                rel="noopener noreferrer"
                class="project-link"
                (click)="$event.stopPropagation()"
                (keydown.enter)="$event.stopPropagation()"
                >{{ "PROJECTS.SOURCE_LINK" | translate }}</a
              >
            </div>
          </div>
        </div>
      </div>
      <div class="projects-more" *ngIf="hasMore || canShowLess">
        <button
          *ngIf="hasMore"
          type="button"
          class="project-link more-button"
          (click)="loadMore()"
        >
          {{ "PROJECTS.SHOW_MORE" | translate }}
        </button>
        <button
          *ngIf="canShowLess"
          type="button"
          class="project-link more-button"
          (click)="showLess()"
        >
          {{ "PROJECTS.SHOW_LESS" | translate }}
        </button>
      </div>
    </section>
  </div>
</div>
