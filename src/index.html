<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tonny Zhao - Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Tonny Zhao, computer engineering student at Concordia University: projects, skills and contact information."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://thelonelyotaku315.github.io/personal-website/" />

    <!-- Link previews (LinkedIn, Discord, iMessage, X...). Crawlers don't run
         JavaScript, so these stay static; the image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tonny Zhao" />
    <meta property="og:title" content="Tonny Zhao - My Portfolio" />
    <meta
      property="og:description"
      content="Computer engineering student at Concordia University. Full-stack web, embedded systems and IoT projects."
    />
    <meta property="og:url" content="https://thelonelyotaku315.github.io/personal-website/" />
    <meta
      property="og:image"
      content="https://thelonelyotaku315.github.io/personal-website/assets/img/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tonny Zhao, computer engineering portfolio: full-stack web, embedded systems and IoT."
    />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:locale:alternate" content="fr_CA" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <script>
      // Apply the saved theme before Angular boots so the page doesn't flash
      (function () {
        try {
          var mode = localStorage.getItem('themeMode') || 'auto';
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var cls = dark ? 'dark-theme' : 'light-theme';
          document.documentElement.classList.add(cls);
          document.body.classList.add(cls);
        } catch (e) {}
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
