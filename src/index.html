<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tonny Zhao - Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Tonny Zhao, computer engineering student at Concordia University."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <script>
      // Apply the saved theme before Angular boots so the page doesn't flash
      (function () {
        try {
          var mode = localStorage.getItem('themeMode') || 'auto';
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var cls = dark ? 'dark-theme' : 'light-theme';
          document.documentElement.classList.add(cls);
          document.body.classList.add(cls);
        } catch (e) {}
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
