<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share image</title>
    <!-- Rendered at 1200x630 by og/build-og-image.mjs -> src/assets/img/og-image.png -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 64px 80px 56px;
        background: #f5f2eb;
        color: #1b1a17;
        font-family: 'IBM Plex Mono', monospace;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 10px;
        background: #1b1a17;
        color: #f5f2eb;
        font: 400 34px/1 'Instrument Serif', serif;
        padding-top: 4px;
      }
      .role {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b665c;
      }
      h1 {
        margin: auto 0 0;
        font: 400 148px/0.95 'Instrument Serif', serif;
        letter-spacing: -0.02em;
      }
      .tagline {
        margin: 18px 0 0;
        font: italic 400 46px/1.15 'Instrument Serif', serif;
        color: #3a3832;
      }
      .rule {
        width: 96px;
        height: 4px;
        margin: 40px 0 26px;
        background: #b8401a;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        font-size: 20px;
        color: #6b665c;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="mark">TZ</div>
      <div class="role">Computer engineering · Concordia University</div>
    </div>
    <h1>Tonny Zhao</h1>
    <p class="tagline">Full-stack web, embedded systems &amp; IoT.</p>
    <div class="rule"></div>
    <div class="footer">
      <span>thelonelyotaku315.github.io/personal-website</span>
      <span>EN / FR</span>
    </div>
  </body>
</html>
